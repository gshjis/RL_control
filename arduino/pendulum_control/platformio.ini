; PlatformIO configuration for Arduino Uno
; Установка: pip install platformio
; Сборка: pio run
; Загрузка: pio run -t upload
; Монитор: pio device monitor

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
monitor_filters = 
    colorize
    default
    ; time

; Оптимизация для размера
build_flags = 
    -Os
    -flto
    -ffunction-sections
    -fdata-sections
    -Wall
    -Wextra
    -std=gnu++11

; Библиотеки (встроенные)
lib_deps = 
    ; Wire встроена
    ; avr/pgmspace встроена

; Увеличиваем максимальный размер секции .text (если нужно)
board_build.f_cpu = 16000000L

; Custom upload protocol (если не стандартный)
; upload_protocol = arduino
; upload_port = /dev/ttyUSB0

; Для отладки через Serial
; build_flags += -DDEBUG_SERIAL=1