[tool.poetry]
name = "rl"
version = "0.1.0"
description = "Simulation and PPO control of an inverted pendulum (C++ physics core, Gymnasium env, pygame GUI)"
authors = ["gshjis <ilya.togan@gmail.com>"]
readme = "README.md"
license = "MIT"

[tool.poetry.dependencies]
python = "^3.12"
numpy = "^2.4.6"
matplotlib = "^3.10.9"
pygame = "^2.6.1"
pybind11 = "^3.0.4"
gymnasium = "^1.3.0"
# Declared explicitly: the code imports it, but it was missing from the
# manifest, so a fresh `poetry install` could never produce a working env.
stable-baselines3 = ">=2.4.0,<3.0.0"
# Kept pinned to the CPU wheel index: PyPI default torch pulls multi-GB CUDA
# builds, which breaks reproducible installs.
torch = {version = "^2.13.0", source = "pytorch_cpu"}
co = {path = "packages/simulation/co", develop = true}
gui = {path = "packages/simulation/gui", develop = true}
ppo = {path = "packages/controllers/ppo", develop = true}
base = {path = "packages/controllers/base", develop = true}
profiling = {path = "profiling", develop = true}
# Transitional: removed in refactoring stage 2/6 together with the bare
# `from base import ...` style imports and the dead controller subtrees.
pid = {path = "packages/controllers/pid", develop = true}
loggers = {path = "packages/loggers", develop = true}
reinforce = {path = "packages/controllers/reinforce", develop = true}
custom = {path = "packages/controllers/custom", develop = true}

[[tool.poetry.source]]
name = "pytorch_cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
ruff = "^0.16.3"
mypy = "^2.3.1"
pytest = "^9.1.1"

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [".venv", "recordings", "output.mp4"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "SIM", "C4"]
ignore = ["N801", "N802", "N803", "N806", "N812", "N999"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
exclude = "(^|/)(\\.venv|recordings)/"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
