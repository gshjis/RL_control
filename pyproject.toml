[tool.poetry]
name = "rl"
version = "0.1.0"
description = ""
authors = ["gshjis <ilya.togan@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
numpy = "^2.4.6"
matplotlib = "^3.10.9"
co = {path = "packages/simulation/co", develop = true}
pygame = "^2.6.1"
scipy = "^1.17.1"
pid = {path = "packages/controllers/pid", develop = true}
gui = {path = "packages/simulation/gui", develop = true}
numba = "^0.65.1"
ffmpeg = "^1.4"
pybind11 = "^3.0.4"
profiling = {path = "profiling", develop = true}
scikit-optimize = "^0.10.2"
loggers = {path = "packages/loggers", develop = true}
reinforce = {path = "packages/controllers/reinforce", develop = true}
custom = {path = "packages/controllers/custom", develop = true}
tqdm = "^4.68.3"
statsmodels = "^0.14.6"
torch = {version = "^2.13.0", source = "pytorch_cpu"}
tensorboard = "^2.21.0"
gymnasium = "^1.3.0"
ppo = {path = "packages/controllers/ppo", develop = true}
base = {path = "packages/controllers/base", develop = true}

[[tool.poetry.source]]
name = "pytorch_cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
mlflow = "^3.13.0"
ipykernel = "^7.3.0"
ruff = "^0.16.3"
mypy = "^2.3.1"
pytest = "^9.1.1"

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [".venv", "recordings", "output.mp4"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "SIM", "C4"]
ignore = ["N801", "N802", "N803", "N806", "N812", "N999"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
exclude = "(^|/)(\\.venv|recordings)/"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
