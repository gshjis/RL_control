name: CI

on:
  push:
    branches: ["*"]
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the lock-refresh step commits on top of the branch
          # and pushes to it — with the default shallow clone git cannot
          # prove ancestry and rejects the push.
          fetch-depth: 0

      - name: Install Poetry
        run: pipx install poetry

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry

      # pyproject.toml is edited more often than the lock file; instead of
      # failing the whole run, refresh poetry.lock in place and push it back
      # to the same branch. The push uses GITHUB_TOKEN, so it does not spawn
      # another workflow run (no loops), and this job continues with the
      # refreshed lock.
      - name: Refresh poetry.lock if stale
        run: |
          if poetry check --lock; then
            echo "poetry.lock is up to date"
            exit 0
          fi
          echo "poetry.lock is stale, regenerating"
          poetry lock
          # Don't push on forks (no write access to upstream)
          if [ "${{ github.repository }}" != "${{ github.event.repository.full_name }}" ]; then
            echo "Fork: refreshed lock stays in the runner, not pushed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poetry.lock
          if git diff --cached --quiet; then
            echo "Lock content unchanged"
            exit 0
          fi
          git commit -m "chore(deps): refresh poetry.lock [skip ci]"
          # Push to the current branch (works for both push and PR events)
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Install dependencies
        run: poetry install --no-root

      - name: Build C++ core
        run: make build

      - name: Lint
        run: |
          poetry run ruff check .
          poetry run ruff format --check .

      - name: Typecheck
        run: poetry run mypy .

      - name: Tests
        run: poetry run pytest -v
